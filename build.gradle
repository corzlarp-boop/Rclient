plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"rclient" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

// Prints the real 1.21.11 / Fabric API class names into api-dump.txt (run: gradlew dumpApi --no-configuration-cache)
tasks.register('dumpApi') {
	notCompatibleWithConfigurationCache("reflection dump")
	doLast {
		def files = sourceSets.client.compileClasspath.files
		def urls = files.collect { it.toURI().toURL() } as URL[]
		def cl = new URLClassLoader(urls, ClassLoader.platformClassLoader)
		def out = new StringBuilder()
		def wantSimple = ['RenderType', 'RenderTypes', 'PlayerModel', 'AvatarRenderState', 'Camera', 'CameraRenderState', 'LevelRenderState'] as Set
		def targets = []
		files.findAll { it.name.endsWith('.jar') }.each { f ->
			new java.util.zip.ZipFile(f).withCloseable { z ->
				z.entries().each { e ->
					def n = e.name
					if (!n.endsWith('.class') || n.contains('$')) return
					def cn = n.substring(0, n.length() - 6).replace('/', '.')
					def simple = cn.substring(cn.lastIndexOf('.') + 1)
					boolean fab = cn.startsWith('net.fabricmc.fabric.api.client.rendering') && (cn.contains('.level.') || simple.contains('Render') || simple.contains('Level') || simple.contains('World'))
					boolean mc = cn.startsWith('net.minecraft.') && wantSimple.contains(simple)
					if (fab || mc) targets << cn
				}
			}
		}
		out << "== matching classes ==\n"
		targets.sort().each { out << it << "\n" }
		targets.sort().each { cn ->
			out << "\n== ${cn} ==\n"
			try {
				def c = Class.forName(cn, false, cl)
				out << "extends ${c.superclass?.name}\n"
				c.declaredFields.each { fl -> if (!fl.synthetic) out << "  F ${java.lang.reflect.Modifier.toString(fl.modifiers)} ${fl.type.simpleName} ${fl.name}\n" }
				c.declaredMethods.each { m -> if (!m.synthetic) out << "  M ${java.lang.reflect.Modifier.toString(m.modifiers)} ${m.returnType.simpleName} ${m.name}(${m.parameterTypes*.simpleName.join(', ')})\n" }
			} catch (Throwable t) { out << "  (failed: ${t})\n" }
		}
		file('api-dump.txt').text = out.toString()
		println "Wrote " + file('api-dump.txt').absolutePath
	}
}